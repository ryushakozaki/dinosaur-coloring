<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7ac943">
<meta name="description" content="4歳から遊べる、恐竜10種類の自由ぬりえゲーム。好きな色で好きなパーツをタップして塗れます。">
<link rel="manifest" href="manifest.json">
<title>きょうりゅう自由ぬりえ</title>
<style>
:root{--green:#69b83f;--dark:#31552b;--cream:#fff9e8;--line:#3d3a32}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(#e9f8ff,#fff9e8 45%,#eaf7dd);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#39452f}
body{touch-action:manipulation}
button{font:inherit;cursor:pointer}
.app{max-width:1180px;margin:auto;padding:10px 12px 28px}
header{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(135deg,#c8f0ff,#fff);padding:16px 18px 14px;box-shadow:0 4px 0 #b6d9a2}
header:before,header:after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.8}
header:before{width:150px;height:70px;right:-30px;top:-30px}
header:after{width:100px;height:50px;left:28%;top:-20px}
.title{position:relative;text-align:center;font-weight:1000;color:#f28b1c;font-size:clamp(30px,6vw,56px);text-shadow:0 3px 0 #fff;letter-spacing:.03em}
.subtitle{position:relative;text-align:center;font-weight:800;font-size:clamp(14px,2.5vw,20px);color:#477b3a}
.section{margin-top:12px;background:#ffffffdc;border:2px solid #d4e5c8;border-radius:22px;padding:12px;box-shadow:0 3px 10px #557a3a18}
.section-title{font-weight:1000;color:#559c38;font-size:20px;margin:2px 4px 10px}
.dinos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dino{border:2px solid #d9e4d1;background:#fff;border-radius:16px;padding:7px 4px 6px;min-width:0;box-shadow:0 2px 0 #d6dfcc}
.dino.selected{border-color:#69b83f;box-shadow:0 0 0 3px #bfeaa9,0 2px 0 #91bd78}
.dino .thumb{height:58px;display:flex;align-items:center;justify-content:center;font-size:40px;filter:saturate(.8)}
.dino b{display:block;text-align:center;font-size:clamp(10px,2vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}
.canvas-wrap{position:relative;background:#fff;border:3px solid #d6c49b;border-radius:20px;padding:8px;overflow:hidden}
svg{display:block;width:100%;height:auto;background:#fff}
.region{fill:#fff;stroke:var(--line);stroke-width:4;stroke-linejoin:round;stroke-linecap:round;cursor:pointer;transition:filter .1s}
.region:active{filter:brightness(.9)}
.detail{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:#222;stroke:none}
.panel{display:flex;flex-direction:column;gap:10px}
.panel-card{background:#fff;border:2px solid #d4e5c8;border-radius:20px;padding:12px}
.panel-title{font-weight:1000;color:#559c38;margin-bottom:8px}
.colors{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.color{width:100%;aspect-ratio:1;border:3px solid #fff;border-radius:12px;box-shadow:0 2px 0 #b5b5b5}
.color.selected{outline:4px solid #365d2d;transform:scale(1.04)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.action{border:0;border-radius:15px;padding:11px 7px;background:#f1f7ec;color:#365b2d;font-weight:900;box-shadow:0 2px 0 #c7d8bd}
.action.danger{background:#fff0f0;color:#a64b4b}
.action.preview{background:#fff0c6;color:#7b5a20}
.message{min-height:44px;text-align:center;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;color:#4b6f40}
.progress{height:12px;background:#e5eedf;border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:#70c74c;border-radius:99px;transition:width .2s}
.done{font-size:22px;text-align:center;color:#4f9c36;font-weight:1000}
.legend{text-align:center;color:#74816c;font-size:13px;font-weight:700}
footer{text-align:center;color:#74816c;font-size:12px;margin-top:12px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.modal-card{background:#fffdf2;border-radius:26px;padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:0 12px 40px #0005}
.modal-card h2{color:#f28b1c;margin:0 0 10px;font-size:30px}
.preview-svg{width:100%;border:2px solid #ddd;border-radius:16px}
.modal-card button{border:0;background:#69b83f;color:#fff;font-weight:1000;border-radius:16px;padding:12px 22px;margin-top:12px}
@media(max-width:800px){.main{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr}.panel-card.colors-card{grid-column:1/-1}.dinos{grid-template-columns:repeat(5,1fr)}}
@media(max-width:520px){.app{padding:7px 7px 20px}.section{padding:8px;border-radius:18px}.dino{padding:4px 2px}.dino .thumb{height:46px;font-size:31px}.dinos{gap:5px}.main{gap:8px}.panel{display:flex}.panel-card{border-radius:17px;padding:9px}.colors{gap:5px}.color{border-radius:9px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="title">🦖 きょうりゅう自由ぬりえ</div>
  <div class="subtitle">すきないろをえらんで、すきなところをタップしてぬろう！</div>
</header>

<section class="section">
  <div class="section-title">🦕 きょうりゅうをえらぼう</div>
  <div class="dinos" id="dinos"></div>
</section>

<section class="section main">
  <div class="canvas-wrap" id="canvasWrap"></div>
  <aside class="panel">
    <div class="panel-card colors-card">
      <div class="panel-title">🎨 いろをえらぼう</div>
      <div class="colors" id="colors"></div>
    </div>
    <div class="panel-card">
      <div class="panel-title">🧸 あそびかた</div>
      <div class="message" id="message">いろをえらんで、恐竜のパーツをタップしてね！</div>
      <div class="progress"><i id="progress"></i></div>
      <div class="legend" id="percent">0% ぬれたよ</div>
    </div>
    <div class="panel-card">
      <div class="actions">
        <button class="action" id="undo">↩️ もどす</button>
        <button class="action" id="reset">🔄 さいしょから</button>
        <button class="action danger" id="clear">⬜ しろにもどす</button>
        <button class="action preview" id="preview">👀 できあがり</button>
      </div>
    </div>
  </aside>
</section>

<footer>4歳くらいから楽しめる、タップだけのかんたん恐竜ぬりえ。まちがえてもだいじょうぶ！</footer>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2>🎉 できあがり！</h2>
    <div id="modalText">すごい！</div>
    <div id="previewHolder"></div>
    <button onclick="closeModal()">もっとぬる！</button>
  </div>
</div>

 {id:'pteranodon',name:'プテラノドン',emoji:'🪽', regions:[

 ]},
 {id:'carnotaurus',name:'カルノタウルス',emoji:'🦖', regions:[
  ['body','M175 245 Q275 175 420 200 Q535 220 635 260 L610 300 Q500 310 400 280 Q275 320 180 295 Z'],
  ['head','M175 235 Q125 220 95 180 Q75 145 100 115 Q135 85 190 110 L230 160 L220 210 Z'],
  ['horn1','M125 120 L105 65 L150 105 Z'],
  ['horn2','M165 110 L165 55 L195 112 Z'],
  ['tail','M430 220 Q600 175 745 205 L690 240 Q565 250 470 265 Z'],
  ['leg1','M300 275 L335 280 L325 430 L290 430 Z'],
  ['leg2','M450 275 L485 280 L495 430 L460 430 Z'],
  ['arm','M225 235 L250 245 L235 305 L205 300 Z'],
  ['belly','M185 270 Q300 305 420 270 L470 300 Q320 335 190 300 Z'],
  ['jaw','M105 165 Q155 180 205 155 L220 180 Q155 210 115 195 Z']
 ]}
];

let selectedColor=PALETTE[0], selectedDino=dinosaurs[0], undoStack=[];
const canvasWrap=document.getElementById('canvasWrap');
const colors=document.getElementById('colors');
const dinos=document.getElementById('dinos');

function renderDino(){
 undoStack=[];
 const d=selectedDino;
 let regions=d.regions.map(([name,path],i)=>`<path class="region" data-name="${name}" data-i="${i}" d="${path}"></path>`).join('');
 // shared scene details
 canvasWrap.innerHTML=`<svg id="art" viewBox="0 0 800 500" aria-label="${d.name}のぬりえ">
   <rect width="800" height="500" fill="#fbfdff" stroke="none"/>
   <path d="M0 390 Q150 350 300 390 T600 390 T800 380 L800 500 L0 500Z" fill="#eef7e8" stroke="none"/>
   <path d="M40 380 L120 285 L180 380 M110 380 L170 260 L230 380 M590 380 L660 270 L735 380" fill="none" stroke="#a9c7a0" stroke-width="5"/>
   <g>${regions}</g>
   <g class="details">
    <path class="detail" d="M72 405 Q170 380 250 405 M520 410 Q620 385 750 410"/>
    <circle class="eye" cx="${d.id==='brachiosaurus'?520:160}" cy="${d.id==='brachiosaurus'?175:145}" r="6"/>
    <path class="detail" d="M${d.id==='triceratops'?'112 165 Q145 155 180 165':'125 150 Q155 160 190 150'}"/>
   </g>
 </svg>`;
 document.querySelectorAll('.region').forEach(el=>el.addEventListener('pointerdown',e=>paint(e.currentTarget)));
 updateProgress();
 document.getElementById('message').textContent='いろをえらんで、恐竜のパーツをタップしてね！';
}
function paint(el){
 const old=el.getAttribute('fill')||'#fff';
 if(old===selectedColor)return;
 undoStack.push({el,old});
 el.setAttribute('fill',selectedColor);
 document.getElementById('message').textContent='いいね！✨ すきないろでどんどんぬろう！';
 updateProgress();
}
function updateProgress(){
 const rs=[...document.querySelectorAll('.region')];
 const painted=rs.filter(r=>{let f=r.getAttribute('fill');return f&&f!=='#fff'}).length;
 const pct=rs.length?Math.round(painted/rs.length*100):0;
 document.getElementById('progress').style.width=pct+'%';
 document.getElementById('percent').textContent=pct+'% ぬれたよ';
 if(pct===100) document.getElementById('message').innerHTML='<span class="done">🎉 ぜんぶぬれた！すごい！</span>';
}
function chooseColor(c,btn){
 selectedColor=c;
 document.querySelectorAll('.color').forEach(x=>x.classList.remove('selected'));
 btn.classList.add('selected');
 document.getElementById('message').textContent='このいろで、すきなところをタップしてね！';
}
function makeColors(){
 PALETTE.forEach((c,i)=>{
   const b=document.createElement('button'); b.className='color'+(i===0?' selected':'');
   b.style.background=c; b.setAttribute('aria-label','色');
   b.onclick=()=>chooseColor(c,b); colors.appendChild(b);
 });
}
function makeDinos(){
 dinosaurs.forEach((d,i)=>{
   const b=document.createElement('button'); b.className='dino'+(i===0?' selected':'');
   b.innerHTML=`<div class="thumb">${d.emoji}</div><b>${d.name}</b>`;
   b.onclick=()=>{selectedDino=d;document.querySelectorAll('.dino').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');renderDino()};
   dinos.appendChild(b);
 });
}
document.getElementById('undo').onclick=()=>{
 const last=undoStack.pop();
 if(last){last.el.setAttribute('fill',last.old);updateProgress();document.getElementById('message').textContent='ひとつもどしたよ！'}
};
document.getElementById('reset').onclick=()=>renderDino();
document.getElementById('clear').onclick=()=>{
 document.querySelectorAll('.region').forEach(r=>r.setAttribute('fill','#fff'));undoStack=[];updateProgress();document.getElementById('message').textContent='しろにもどしたよ！もう一度ぬってみよう！'
};
document.getElementById('preview').onclick=()=>{
 const art=document.getElementById('art').cloneNode(true);
 art.removeAttribute('id'); art.classList.add('preview-svg');
 document.getElementById('previewHolder').innerHTML='';document.getElementById('previewHolder').appendChild(art);
 document.getElementById('modalText').textContent=`${selectedDino.name}をじょうずにぬれたね！`;
 document.getElementById('modal').classList.add('show');
};
function closeModal(){document.getElementById('modal').classList.remove('show')}
makeColors();makeDinos();renderDino();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body></html>
