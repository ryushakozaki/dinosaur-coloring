<!doctype html>
<html lang="ja">

<title>きょうりゅう自由ぬりえ</title>
<style>
:root{--green:#67b83f;--dark:#31552b;--cream:#fffaf0;--ink:#24231f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:linear-gradient(#eaf8ff,#fffaf0 50%,#eaf7df);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#39452f}
body{touch-action:manipulation}
button{font:inherit;cursor:pointer}
.app{max-width:1220px;margin:auto;padding:8px 10px 28px}
header{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(135deg,#c9f1ff,#fff);padding:14px 16px;box-shadow:0 4px 0 #b8dca4}
.title{text-align:center;font-size:clamp(28px,6vw,54px);font-weight:1000;color:#f28b1c;text-shadow:0 3px #fff}.subtitle{text-align:center;font-size:clamp(13px,2.4vw,19px);font-weight:900;color:#477b3a}
.section{margin-top:11px;background:#ffffffec;border:2px solid #d6e7cb;border-radius:20px;padding:10px;box-shadow:0 3px 12px #557a3a18}.section-title{font-weight:1000;color:#559c38;font-size:19px;margin:2px 4px 9px}
.dinos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.dino{border:2px solid #dce7d4;background:#fff;border-radius:15px;padding:5px 3px;box-shadow:0 2px #d4dfcb;min-width:0}.dino.selected{border-color:#67b83f;box-shadow:0 0 0 3px #bfeaa9}.thumb{height:56px;display:flex;align-items:center;justify-content:center;font-size:39px}.dino b{display:block;text-align:center;font-size:clamp(10px,1.9vw,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:11px}.canvas-wrap{background:#fff;border:3px solid #d6c49b;border-radius:19px;padding:5px;overflow:hidden;box-shadow:0 3px 10px #00000012}
svg{display:block;width:100%;height:auto;background:#fff;border-radius:13px}.region{fill:#fff;stroke:var(--ink);stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round;cursor:pointer;pointer-events:all;touch-action:none}.region:active{filter:brightness(.92)}.detail{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.fine{fill:none;stroke:#4b4942;stroke-width:1.15;stroke-linecap:round;pointer-events:none}.eye{fill:#222;stroke:none;pointer-events:none}
.panel{display:flex;flex-direction:column;gap:9px}.panel-card{background:#fff;border:2px solid #d6e7cb;border-radius:18px;padding:11px}.panel-title{font-weight:1000;color:#559c38;margin-bottom:8px}.colors{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.color{width:100%;aspect-ratio:1;border:3px solid #fff;border-radius:10px;box-shadow:0 2px #aaa;touch-action:manipulation}.color.selected{outline:4px solid #31552b;transform:scale(1.04)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.action{border:0;border-radius:14px;padding:10px 5px;background:#f1f7ec;color:#365b2d;font-weight:1000;box-shadow:0 2px #c7d8bd}.action.danger{background:#fff0f0;color:#a64b4b}.action.preview{background:#fff0c6;color:#7b5a20}.message{min-height:44px;text-align:center;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}.progress{height:12px;background:#e5eedf;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:#70c74c;border-radius:99px;transition:width .2s}.legend{text-align:center;color:#74816c;font-size:12px;font-weight:800;margin-top:5px}.done{font-size:20px;color:#4f9c36;font-weight:1000}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modal-card{background:#fffdf2;border-radius:25px;padding:22px;max-width:430px;width:100%;text-align:center}.modal-card h2{color:#f28b1c;margin:0 0 8px;font-size:29px}.modal-card button{border:0;background:#67b83f;color:#fff;font-weight:1000;border-radius:15px;padding:11px 20px;margin-top:10px}.preview-svg{width:100%;border:2px solid #ddd;border-radius:14px}
@media(max-width:820px){.main{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr}.colors-card{grid-column:1/-1}}
@media(max-width:520px){.app{padding:5px 6px 18px}.section{padding:7px;border-radius:17px}.dinos{gap:4px}.dino{padding:4px 2px}.thumb{height:43px;font-size:29px}.panel{display:flex}.panel-card{padding:9px}.colors{gap:5px}.color{border-radius:8px}}
</style>

let selectedColor=PALETTE[0],selectedDino=D[0],undoStack=[];
const canvasWrap=document.getElementById('canvasWrap'),colors=document.getElementById('colors'),dinos=document.getElementById('dinos');
function esc(s){return s.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function renderDino(){
 undoStack=[];const d=selectedDino;
 const regions=d.regions.map(([n,p],i)=>`<path class="region" data-name="${n}" data-i="${i}" d="${p}" fill="#fff" tabindex="0" role="button" aria-label="${n}"/>`).join('');
 const details=(d.detail||[]).join('');
 canvasWrap.innerHTML=`<svg id="art" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="${esc(d.name)}のぬりえ">
 <rect width="800" height="500" fill="#fbfdff"/>
 <path d="M0 405 Q140 370 285 404 T565 399 T800 392 L800 500 L0 500Z" fill="#eef7e8"/>
 <path d="M20 390 L120 280 L196 390 M85 390 L150 250 L230 390 M570 390 L655 270 L748 390" fill="none" stroke="#b8cfad" stroke-width="5"/>
 <g id="regions">${regions}</g>
 <g aria-hidden="true">${details}</g>
 </svg>`;
 // click + pointerup の両方を使わず click に統一。iOS Safariで確実に発火する。
 document.querySelectorAll('.region').forEach(el=>{
   el.addEventListener('click',()=>paint(el));
   el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();paint(el)}});
 });
 updateProgress();document.getElementById('message').textContent='いろをえらんで、恐竜のパーツをタップしてね！';
}
function paint(el){
 const old=el.getAttribute('fill')||'#fff';
 if(old.toLowerCase()===selectedColor.toLowerCase())return;
 undoStack.push({el,old});el.setAttribute('fill',selectedColor);
 document.getElementById('message').textContent='いいね！✨ すきないろでどんどんぬろう！';updateProgress();
 if(navigator.vibrate) navigator.vibrate(10);
}
function updateProgress(){
 const rs=[...document.querySelectorAll('.region')],painted=rs.filter(r=>(r.getAttribute('fill')||'#fff').toLowerCase()!=='#fff').length;
 const pct=rs.length?Math.round(painted/rs.length*100):0;document.getElementById('progress').style.width=pct+'%';document.getElementById('percent').textContent=pct+'% ぬれたよ';
 if(pct===100)document.getElementById('message').innerHTML='<span class="done">🎉 ぜんぶぬれた！すごい！</span>';
}
function chooseColor(c,b){selectedColor=c;document.querySelectorAll('.color').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('message').textContent='このいろで、すきなところをタップしてね！'}
function makeColors(){PALETTE.forEach((c,i)=>{const b=document.createElement('button');b.className='color'+(i===0?' selected':'');b.style.background=c;b.setAttribute('aria-label','色');b.addEventListener('click',()=>chooseColor(c,b));colors.appendChild(b)})}
function makeDinos(){D.forEach((d,i)=>{const b=document.createElement('button');b.className='dino'+(i===0?' selected':'');b.innerHTML=`<div class="thumb">${d.emoji}</div><b>${d.name}</b>`;b.addEventListener('click',()=>{selectedDino=d;document.querySelectorAll('.dino').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');renderDino()});dinos.appendChild(b)})}
document.getElementById('undo').addEventListener('click',()=>{const last=undoStack.pop();if(last){last.el.setAttribute('fill',last.old);updateProgress();document.getElementById('message').textContent='ひとつもどしたよ！'}});
document.getElementById('reset').addEventListener('click',renderDino);
document.getElementById('clear').addEventListener('click',()=>{document.querySelectorAll('.region').forEach(r=>r.setAttribute('fill','#fff'));undoStack=[];updateProgress();document.getElementById('message').textContent='しろにもどしたよ！もう一度ぬってみよう！'});
document.getElementById('preview').addEventListener('click',()=>{const art=document.getElementById('art').cloneNode(true);art.removeAttribute('id');art.classList.add('preview-svg');document.getElementById('previewHolder').replaceChildren(art);document.getElementById('modalText').textContent=`${selectedDino.name}をじょうずにぬれたね！`;document.getElementById('modal').classList.add('show')});
document.getElementById('closeModal').addEventListener('click',()=>document.getElementById('modal').classList.remove('show'));
makeColors();makeDinos();renderDino();
</script>
