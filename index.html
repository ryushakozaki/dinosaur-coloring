['leg2','M438 291 C458 281 480 287 488 309 C497 335 499 375 502 417 L504 443 L468 443 C462 403 456 364 447 336 C441 316 432 300 438 291Z'],
['arm','M215 224 C234 220 250 229 251 246 C252 263 243 280 233 297 L216 313 L195 301 L207 271 C214 253 206 231 215 224Z']],detail:[`<path class="detail" d="M112 151 C135 131 163 128 186 139 M111 176 C137 187 165 184 189 172 M119 201 C142 211 166 208 185 198"/>`,`<path class="fine" d="M228 224 C254 240 275 259 291 286 M274 214 C301 232 324 252 341 290 M322 212 C351 230 376 252 394 295 M370 215 C399 233 425 256 443 300 M421 222 C450 241 476 263 495 305 M473 232 C503 250 528 272 548 309"/>`]}
];

let selectedColor=PALETTE[0],selectedDino=D[0],undoStack=[];
const canvasWrap=document.getElementById('canvasWrap'),colors=document.getElementById('colors'),dinos=document.getElementById('dinos');
function esc(s){return s.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function renderDino(){
 undoStack=[];const d=selectedDino;
 const regions=d.regions.map(([n,p],i)=>`<path class="region" data-name="${n}" data-i="${i}" d="${p}" fill="#fff" tabindex="0" role="button" aria-label="${n}"/>`).join('');
 const details=(d.detail||[]).join('');
 canvasWrap.innerHTML=`<svg id="art" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="${esc(d.name)}のぬりえ">
 <rect width="800" height="500" fill="#fbfdff"/>
 <path d="M0 405 Q140 370 285 404 T565 399 T800 392 L800 500 L0 500Z" fill="#eef7e8"/>
 <path class="anatomy" d="M20 391 L92 319 L143 391 M84 390 L151 265 L218 391 M579 391 L651 276 L748 391"/>
 <path class="anatomy" d="M0 414 Q150 393 292 414 T560 410 T800 406 M0 443 Q160 424 310 444 T800 435"/>
 <g id="regions">${regions}</g>
 <g aria-hidden="true">${details}</g>
 </svg>`;
 const svg=document.getElementById('art');
 // iPhone Safariでは、重なったSVGパーツのどれがタップされたかを
 // ブラウザ任せにせず、座標から「その点を含む最も小さい領域」を選びます。
 svg.addEventListener('click',e=>{
   const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());
   const hits=[...svg.querySelectorAll('.region')].filter(r=>{
     try{return r.isPointInFill(pt)}catch(_){return false}
   });
   if(!hits.length)return;
   hits.sort((a,b)=>{
     const A=a.getBBox(),B=b.getBBox();
     return (A.width*A.height)-(B.width*B.height);
   });
   paint(hits[0]);
 });
 svg.addEventListener('keydown',e=>{
   const r=e.target.closest?.('.region');
   if(r && (e.key==='Enter'||e.key===' ')){e.preventDefault();paint(r)}
 });
 updateProgress();document.getElementById('message').textContent='いろをえらんで、恐竜のパーツをタップしてね！';
}
function paint(el){
 const old=el.getAttribute('fill')||'#fff';
 if(old.toLowerCase()===selectedColor.toLowerCase())return;
 undoStack.push({el,old});
 el.setAttribute('fill',selectedColor);
 el.style.fill=selectedColor;
 el.style.setProperty('fill',selectedColor);
 document.getElementById('message').textContent='いいね！✨ すきないろでどんどんぬろう！';
 updateProgress();
 if(navigator.vibrate) navigator.vibrate(10);
}
function updateProgress(){
 const rs=[...document.querySelectorAll('.region')],painted=rs.filter(r=>(r.getAttribute('fill')||'#fff').toLowerCase()!=='#fff').length;
 const pct=rs.length?Math.round(painted/rs.length*100):0;document.getElementById('progress').style.width=pct+'%';document.getElementById('percent').textContent=pct+'% ぬれたよ';
 if(pct===100)document.getElementById('message').innerHTML='<span class="done">🎉 ぜんぶぬれた！すごい！</span>';
}
function chooseColor(c,b){selectedColor=c;document.querySelectorAll('.color').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('message').textContent='このいろで、すきなところをタップしてね！'}
function makeColors(){PALETTE.forEach((c,i)=>{const b=document.createElement('button');b.className='color'+(i===0?' selected':'');b.style.background=c;b.setAttribute('aria-label','色');b.addEventListener('click',()=>chooseColor(c,b));colors.appendChild(b)})}
function makeDinos(){D.forEach((d,i)=>{const b=document.createElement('button');b.className='dino'+(i===0?' selected':'');b.innerHTML=`<div class="thumb">${d.emoji}</div><b>${d.name}</b>`;b.addEventListener('click',()=>{selectedDino=d;document.querySelectorAll('.dino').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');renderDino()});dinos.appendChild(b)})}
document.getElementById('undo').addEventListener('click',()=>{const last=undoStack.pop();if(last){last.el.setAttribute('fill',last.old);last.el.style.fill=last.old;updateProgress();document.getElementById('message').textContent='ひとつもどしたよ！'}});
document.getElementById('reset').addEventListener('click',renderDino);
document.getElementById('clear').addEventListener('click',()=>{document.querySelectorAll('.region').forEach(r=>{r.setAttribute('fill','#fff');r.style.fill='#fff'});undoStack=[];updateProgress();document.getElementById('message').textContent='しろにもどしたよ！もう一度ぬってみよう！'});
document.getElementById('preview').addEventListener('click',()=>{const art=document.getElementById('art').cloneNode(true);art.removeAttribute('id');art.classList.add('preview-svg');document.getElementById('previewHolder').replaceChildren(art);document.getElementById('modalText').textContent=`${selectedDino.name}をじょうずにぬれたね！`;document.getElementById('modal').classList.add('show')});
document.getElementById('closeModal').addEventListener('click',()=>document.getElementById('modal').classList.remove('show'));
makeColors();makeDinos();renderDino();
</script>
</body></html>
